# ==============================================================================
# Core Application
# ==============================================================================
spring.application.name=rock-paper-scissors

# ==============================================================================
# Concurrency (Project Loom - Java 21)
# ==============================================================================
spring.threads.virtual.enabled=true

# ==============================================================================
# CORS Configuration (Cloud-Native)
# ==============================================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ==============================================================================
# Database Configuration (Cloud-Native / 12-Factor App)
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rock_paper_scissors_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# Connection Pool (HikariCP - Resiliencia Cloud)
# ==============================================================================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ==============================================================================
# Flyway Migrations
# ==============================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ==============================================================================
# JPA / Hibernate
# ==============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================================================================
# Spring Security & OAuth2 Client (Google)
# ==============================================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google-client-id-placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
spring.security.oauth2.client.registration.google.scope=openid,profile,email